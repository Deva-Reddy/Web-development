<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <header>
        <a href="#" class="logo">Logo</a>
        <div class="menu">
            <nav>
                <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">Dropdown</a>
                        
                    </li>
                      <li class="nav-item">
                        <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">Dropdown</a>
                        
                      </li>
                      <li class="nav-item">
                        <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">Dropdown</a>
                       
                      </li>
                      <li class="nav-item">
                        <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">Dropdown</a>
                       
                      </li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="page">
      <div class="details">
        <div class="input1">
          <div class="inputbox">
            <span class="first-name">First Name</span>
            <input type="text" required />
          </div>
          <div class="inputbox">
            <span class="first-name">Last Name</span>
            <input type="text" required />
          </div>
        </div>
        <div class="input2">
          <span class="email">Email</span>
          <input type="email" required />
        </div>
        <div class="input2">
          <span class="number">Contact Number</span>
          <div class="phone">
           <table>
              <tr>
                <td width="15%">
                  <input type="text" name="number" placeholder="+91" required />
                </td>
                <td>
                  <input type="text" required />
                </td>
              </tr>
            </table>
          </div>
        </div>
        <div class="input2">
          <span class="Address">Current Place</span>
          <p>To Connect you with oppurtunities close to u</p>
          <input type="text" placeholder="Current Location" />
        </div>
        <div class="input2">
          <div class="a">
            <section><label>Gender</label></section>
            <section><label class="red">Required</label></section>
          </div>
          <div class="select">
            <button>male</button>
            <button>Female</button>
            <button>Others</button>
          </div>
        </div>
        <div class="input2">
          <div class="b">
            <section>
              <label>Language you know</label>
            </section>
            <section>
              <label class="red">Required</label>
            </section>
          </div>
          <div class="select-btn">
            <button>English</button>
            <button>Hindi</button>
            <button>Telugu</button>
            <button>Tamil</button>
            <button>Marathi</button>
            <button>French</button>
            <button>Add more languages</button>
          </div>
        </div>
        <div class="input2">
          <div class="c">
            <section><label>Type</label></section>
            <section><label class="red">Required</label></section>
          </div>
          <div class="select-btn">
            <button class="type">College Student</button>
            <button class="type">Freshers</button>
            <button class="type">working professional</button>
            <button class="type">School Student</button>
            <button class="type">woman returning to work</button>
          </div>
        </div>
      </div>
      <div class="btn">
        <button class="submit-btn" id="submit">Next</button>
      </div>
    </div>
  </body>
</html>
