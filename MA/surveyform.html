<!DOCTYPE html>
<html>

<body style="background-color:green">

  <h1 style="margin-left: 515;text-align: center;">Student Survey Form</h1>
  <div style="background-color:azure;margin-left:500px;margin-right:500px;text-align: center;">
    <br>

    <form>

      <div style="margin-left:10;">

        <label style="width:310;height:100;">Name</label>
        <input type="text" name="Name" placeholder="Enter your Name"><br>
        <br>
      </div>

      <div style="margin-left: 10;">
        <label>Email</label><br>
        <input type="text" name="Name" placeholder="Enter your Email" style="width:310px"><br>
        <br>
      </div>

      <div style="margin-left: 10;">
        <label>Age</label><br>
        <input type="Number" name="Name" placeholder="Enter your Age" style="width:310px"><br>
        <br>
      </div>

      <div style="margin-left: 10;">
        <label>Gender</label><br>
        <input type="radio" name="gender" value="male">Male<br>
        <input type="radio" name="gender" value="female">Female<br>
        <br>
      </div>

      <div style="margin-left: 10;">
        Which option best describes you?<br>
        <select name="select_box_name" style="width:310"><br>
          <option value="value 1">Student</option>
          <option value="value 2">Teacher</option>
          <option value="value 3">Trainer</option>
          <option value="value 4">Employee</option>
        </select>
        <br>
        <br>
      </div>

      <div style="margin-left: 20;">
        Languages and Frameworks Known (Check all that apply)<br>
        <input type="checkbox" name="SQL">
        <label>SQL</label><br>
        <input type="checkbox" name="C#">
        <label>C#</label><br>
        <input type="checkbox" name="HTML">
        <label>HTML</label><br>
        <input type="checkbox" name="CSS">
        <label>CSS</label><br>
        <input type="checkbox" name="Java Script">
        <label>Java Script</label><br>
        <input type="checkbox" name="J Query">
        <label>J Query</label><br>
        <br>
      </div>

      <div style="margin-left: 10;">
        Any comments or suggestions<br>
        <input type="text" name="text" style="width:310;height: 30;"><br>
      </div>

      <br>
      <input type="submit" name="submit" style="background-color: green; margin-left: 10;width:310">
      <br>
      <br>







    </form>

  </div>
</body>

</html>
