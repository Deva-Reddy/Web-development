<!DOCTYPE html>
<html>

<head>
    <title>Login page</title>
    <style>
        .name {
            background-color: blueviolet;
        }

        .a {
            margin-left: 550px;
            margin-right: 500px;
            margin-top: 200px;
            text-align: center;
            background-color: antiquewhite;
            width: 400px;
            height: 300px;
        }
        .container{
            text-align: center;
            width: auto;
            height: auto;
            margin-left: 50px;
        }
    </style>
</head>

<body class="name">
    
    <div class="a">
        <p style="text-align: center;">Login form</p>
        <div class="container">
            <label>Email</label>
            <input type="text" placeholder="Enter your Email" style="margin-top:50px;" required><br>
            <br>
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required><br>
            <br>
            <label>
                <input type="checkbox" name="remember">remember me
            </label>
            <button type="submit">Login</button>
        </div>
    </div>
</body>

</html>
